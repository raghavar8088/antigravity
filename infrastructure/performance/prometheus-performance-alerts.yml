groups:
  - name: trading-performance
    rules:
      - alert: SignalToExecutionLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(trading_signal_to_execution_seconds_bucket[5m])) by (le)) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Signal-to-execution latency exceeds 100ms p95

      - alert: OrderSubmissionLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(trading_order_submission_seconds_bucket[5m])) by (le)) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Order submission latency exceeds 50ms p95

      - alert: MarketDataBackpressure
        expr: trading_market_bus_queue_depth > 75000
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: Market data bus queue depth is high

      - alert: StrategyEvaluationSlow
        expr: histogram_quantile(0.95, sum(rate(trading_strategy_evaluation_seconds_bucket[5m])) by (le)) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Strategy evaluation exceeds 50ms p95

      - alert: AICacheHitRateLow
        expr: trading_ai_cache_hit_rate < 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: AI decision cache hit rate is below target

      - alert: RuntimeGCPauseHigh
        expr: histogram_quantile(0.99, sum(rate(go_gc_duration_seconds_bucket[5m])) by (le)) > 0.02
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Go GC p99 pause exceeds 20ms
