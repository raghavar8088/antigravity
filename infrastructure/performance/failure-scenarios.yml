scenarios:
  exchange_outage:
    objective: verify websocket reconnect, heartbeat alarms, stale-market blocking, and no duplicate orders
    inject:
      - close_exchange_websocket
      - drop_market_ticks_for_seconds: 30
    success:
      recovery_seconds_lt: 10
      duplicate_orders_eq: 0
      stale_trade_approvals_eq: 0

  database_outage:
    objective: verify trading path remains bounded and persistence backlog is visible
    inject:
      - reject_postgres_connections_for_seconds: 60
      - reject_mongo_connections_for_seconds: 60
    success:
      order_submission_unblocked: true
      persistence_queue_depth_alarm: true
      data_loss_eq: 0

  redis_outage:
    objective: verify cache miss fallback without incorrect approvals
    inject:
      - reject_redis_connections_for_seconds: 60
    success:
      cache_fallback_ok: true
      ai_cache_hit_rate_recovers: true

  ai_outage:
    objective: verify ML/technical fallback and AI circuit breaker
    inject:
      - return_ai_provider_5xx_for_seconds: 120
    success:
      execution_path_blocked_by_ai_eq: 0
      ai_circuit_breaker_open: true
      fallback_latency_ms_lt: 100

  market_spike:
    objective: verify backpressure, risk controls, tail-risk halt, and dashboard responsiveness
    inject:
      - ticks_per_second: 100000
      - price_move_pct_1m: 5
    success:
      market_bus_dropped_pct_lt: 1
      signal_to_order_p95_ms_lt: 100
      tail_risk_halt_triggered: true
