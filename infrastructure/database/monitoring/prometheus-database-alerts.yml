groups:
  - name: trading-database
    rules:
      - alert: PostgresReplicationLagHigh
        expr: pg_replication_lag_seconds > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL replication lag exceeds 10 seconds
          description: Read replicas or failover standby are behind primary.

      - alert: PostgresSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration_seconds[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Slow PostgreSQL transactions detected
          description: Investigate query plans, locks, and missing indexes.

      - alert: PostgresLowCacheHitRate
        expr: (sum(rate(pg_stat_database_blks_hit[5m])) / (sum(rate(pg_stat_database_blks_hit[5m])) + sum(rate(pg_stat_database_blks_read[5m])))) < 0.97
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL cache hit rate below 97%
          description: Increase shared buffers, reduce scans, or add indexes.

      - alert: PgbouncerPoolSaturated
        expr: pgbouncer_pools_cl_waiting > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: PgBouncer clients waiting for pooled connections
          description: Trading query latency can degrade if write pool saturates.

      - alert: TimescaleChunkCompressionLag
        expr: timescaledb_compressed_chunk_lag_days > 35
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Timescale compression policy is lagging
          description: Chunks older than policy threshold remain uncompressed.

      - alert: DatabaseBackupStale
        expr: time() - trading_db_last_successful_backup_timestamp > 1800
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Incremental backup is stale
          description: No successful backup has completed in the last 30 minutes.

      - alert: DataQualityCritical
        expr: trading_data_quality_score < 70
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Market data quality is critical
          description: Missing candles, drift, duplicates, or bad prices detected.
