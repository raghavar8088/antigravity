[databases]
trading_write = host=${POSTGRES_PRIMARY_HOST} port=5432 dbname=${POSTGRES_DB} pool_size=40 reserve_pool=10 pool_mode=transaction
trading_read = host=${POSTGRES_READ_REPLICA_HOST} port=5432 dbname=${POSTGRES_DB} pool_size=60 reserve_pool=20 pool_mode=transaction
research_read = host=${POSTGRES_RESEARCH_HOST} port=5432 dbname=${POSTGRES_RESEARCH_DB} pool_size=20 reserve_pool=10 pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 60
server_lifetime = 3600
query_timeout = 30
query_wait_timeout = 5
client_idle_timeout = 300
idle_transaction_timeout = 15

server_tls_sslmode = verify-full
server_tls_ca_file = /etc/ssl/certs/postgres-ca.pem
client_tls_sslmode = require
client_tls_cert_file = /etc/ssl/certs/pgbouncer.crt
client_tls_key_file = /etc/ssl/private/pgbouncer.key

ignore_startup_parameters = extra_float_digits,options
application_name_add_host = 1
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
