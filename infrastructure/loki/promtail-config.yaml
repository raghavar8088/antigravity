server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    batchwait: 1s
    batchsize: 1048576
    timeout: 10s
    backoff_config:
      min_period: 100ms
      max_period: 5s
      max_retries: 20

scrape_configs:
  # ─────────────────────────────────────────────
  # Trading Engine Logs (Go JSON)
  # ─────────────────────────────────────────────
  - job_name: trading_engine
    static_configs:
      - targets:
          - localhost
        labels:
          job: trading_engine
          env: production
          __path__: /var/log/trading/engine*.log

    pipeline_stages:
      - json:
          expressions:
            severity: severity
            event_type: event_type
            trace_id: trace_id
            exchange: exchange
            component: component
            account_id: account_id
      - labels:
          severity:
          event_type:
          component:
          exchange:
          account_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - drop:
          expression: '.*DEBUG.*'
          drop_counter_reason: debug_dropped

  # ─────────────────────────────────────────────
  # Next.js Client Logs
  # ─────────────────────────────────────────────
  - job_name: nextjs_client
    static_configs:
      - targets:
          - localhost
        labels:
          job: nextjs_client
          env: production
          __path__: /var/log/trading/nextjs*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            url: url
            status: status
      - labels:
          level:
          status:

  # ─────────────────────────────────────────────
  # Docker container logs (when running via compose)
  # ─────────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.trading.scrape=true"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_trading_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            event_type: event_type
            trace_id: trace_id
      - labels:
          severity:
          event_type:
