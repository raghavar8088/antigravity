name: Build & Deploy Engine

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/deploy.yml"

jobs:
  security-scan:
    name: Security & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: engine/go.sum

      - name: govulncheck — Go vulnerability scan
        working-directory: engine
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: go vet
        working-directory: engine
        run: go vet ./...

      - name: staticcheck
        working-directory: engine
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: npm audit (client)
        working-directory: client
        run: npm audit --audit-level=high

  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/antigravity-engine:latest

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/antigravity-engine:latest
            docker stop antigravity_engine || true
            docker rm antigravity_engine || true
            # Resource limits (--memory, --pids-limit, ulimits) must mirror
            # docker-compose.prod.yml exactly. Without --memory, a leaking
            # process has no cgroup ceiling and gets killed by the *host*
            # OOM killer instead of the container's — larger blast radius,
            # risking other processes on the box (e.g. the PM2 worker).
            # See Jun 2026 incident: unconstrained run hit 1.5GB before kill;
            # the 600m-capped container caps each leak episode at 600MB.
            docker run -d \
              --name antigravity_engine \
              --restart unless-stopped \
              -p 80:8080 \
              --env-file /home/ubuntu/antigravity/.env \
              -e INITIAL_PAPER_BALANCE_USD=1000 \
              -v /home/ubuntu/antigravity/data:/app/data \
              --memory 600m \
              --cpus 1.50 \
              --pids-limit 512 \
              --ulimit nofile=65535:65535 \
              --health-cmd "/app/antigravity --healthcheck" \
              --health-interval 30s \
              --health-timeout 5s \
              --health-retries 5 \
              --health-start-period 40s \
              ghcr.io/${{ github.repository_owner }}/antigravity-engine:latest
