name: Client E2E (Playwright)

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/client-e2e.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-e2e.yml"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # No Go engine, MongoDB, or live market data feed is started here on
      # purpose — the suite mocks the browser-side BTC price/candle and
      # mock-trading API calls (e2e/fixtures/) and otherwise relies on this
      # app's existing graceful "engine offline" / "Mongo not configured"
      # fallbacks. See client/e2e/README.md.
      - name: Run Playwright tests
        working-directory: client
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

      - name: Upload test traces/videos
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 14
