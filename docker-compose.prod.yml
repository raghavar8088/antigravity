version: '3.8'

services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: antigravity_engine
    restart: always
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/engine.db
    volumes:
      - ./data:/app/data
