version: '3.8'

# Production backend only — frontend runs on Vercel.
# On Vercel set INTERNAL_API_URL to:
#   http://YOUR_AWS_PUBLIC_IP   (same host:port as below, no trailing slash)
services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: antigravity_engine
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/engine.db
      - ENGINE_DATA_DIR=/app/data
      - GOMEMLIMIT=450MiB
      - GOGC=70
      - PORT=8080
      - PRE_LIVE_HOST=antigravity_prelive
      - PRE_LIVE_PORT=8082
    volumes:
      - ./data:/app/data
    mem_limit: 600m
    cpus: 1.50
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      # Image is FROM scratch — no wget/curl available. The binary does an
      # in-process self-check instead (see cmd/antigravity/main.go runHealthcheck).
      test: ["CMD", "/app/antigravity", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  pre_live:
    build:
      context: ./engine
      dockerfile: Dockerfile.prelive
    container_name: antigravity_prelive
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - PRE_LIVE_PORT=8082
      - PRE_LIVE_INITIAL_BALANCE_USD=100
      - PRE_LIVE_LEVERAGE=10
      - FIXED_TRADE_SIZE_BTC=0.001
      - MIN_EXECUTION_SIZE_BTC=0.0001
      - GOMEMLIMIT=300MiB
      - GOGC=80
    mem_limit: 400m
    cpus: 1.0
    pids_limit: 256

  # BTC Pre-Live Engine (Phase 3) — SECOND instance of the same pre_live binary:
  # $1,000 paper account, 49-strategy qualified whitelist, own Mongo account_key.
  # Fully isolated from the default pre_live instance above. The Delta real-money
  # mirror is explicitly disarmed (LIVE_ENGINE_AUTO_ENABLE=false, set here in
  # environment: so it wins over anything inherited from .env) until Phase 4.
  btc_pre_live:
    build:
      context: ./engine
      dockerfile: Dockerfile.prelive
    container_name: antigravity_btc_prelive
    restart: unless-stopped
    ports:
      - "8092:8092"
    env_file:
      - .env
    environment:
      - PRE_LIVE_PORT=8092
      - PRE_LIVE_OWNER_ACCOUNT_KEY=btc_pre_live_engine
      - PRE_LIVE_INITIAL_BALANCE_USD=1000
      - PRE_LIVE_WHITELIST_FILE=/app/data/btc_prelive_whitelist.json
      # 600h ≈ 150 synthetic 4h candles so all 49 strategies (some need ≥40 4h
      # bars of history) are armed from startup, not trickling in over ~2 days.
      - PRE_LIVE_WARMUP_HOURS=600
      # Raise the 4h rolling-context cap above its 30 default: 13 whitelisted
      # strategies gate on >30 4h candles (up to 65) and would never fire live
      # otherwise, despite qualifying. 80 covers the deepest with margin.
      - SCALERS_MAX_CANDLES_4H=80
      - PRE_LIVE_LEVERAGE=10
      - FIXED_TRADE_SIZE_BTC=0.001
      - MIN_EXECUTION_SIZE_BTC=0.0001
      - LIVE_ENGINE_AUTO_ENABLE=false
      # Port 8092 is internet-exposed for the Vercel dashboard, and the pre_live
      # HTTP API is only token-gated — so this PAPER-ONLY instance gets NO broker
      # keys at all (explicit blanks override the shared .env): even a successful
      # /api/live/enable call can arm nothing. Phase 4 revisits this deliberately.
      - DELTA_API_KEY=
      - DELTA_API_SECRET=
      # Shared secret required on every /api/* request (except /health).
      # Set the real value in .env on the server as BTC_PRE_LIVE_API_TOKEN.
      - PRE_LIVE_API_TOKEN=${BTC_PRE_LIVE_API_TOKEN}
      - GOMEMLIMIT=300MiB
      - GOGC=80
    mem_limit: 400m
    cpus: 1.0
    pids_limit: 256

  # ETH Pre-Live Engine — third pre_live instance: $1,000 paper, the 46-strategy
  # ETH-qualified whitelist (40 strict OOS passers + 6 tier B), ETH-USD live
  # feed. Same isolation + hardening posture as the BTC desk: own account_key,
  # broker keys blanked, token-gated API, mirror disarmed.
  eth_pre_live:
    build:
      context: ./engine
      dockerfile: Dockerfile.prelive
    container_name: antigravity_eth_prelive
    restart: unless-stopped
    ports:
      - "8093:8093"
    env_file:
      - .env
    environment:
      - PRE_LIVE_PORT=8093
      - PRE_LIVE_OWNER_ACCOUNT_KEY=eth_pre_live_engine
      - PRE_LIVE_INITIAL_BALANCE_USD=1000
      - PRE_LIVE_WHITELIST_FILE=/app/data/eth_prelive_whitelist.json
      - PRE_LIVE_FEED_SYMBOL=ETH-USD
      - PRE_LIVE_WARMUP_SYMBOL=ETHUSDT
      - PRE_LIVE_WARMUP_HOURS=600
      - SCALERS_MAX_CANDLES_4H=80
      - PRE_LIVE_LEVERAGE=10
      - FIXED_TRADE_SIZE_BTC=0.05
      - MIN_EXECUTION_SIZE_BTC=0.001
      - LIVE_ENGINE_AUTO_ENABLE=false
      - DELTA_API_KEY=
      - DELTA_API_SECRET=
      - PRE_LIVE_API_TOKEN=${BTC_PRE_LIVE_API_TOKEN}
      - GOMEMLIMIT=300MiB
      - GOGC=80
    mem_limit: 400m
    cpus: 1.0
    pids_limit: 256
