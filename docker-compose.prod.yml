version: '3.8'

# Production backend only — frontend runs on Vercel.
# On Vercel set INTERNAL_API_URL to:
#   http://YOUR_AWS_PUBLIC_IP   (same host:port as below, no trailing slash)
services:
  engine:
    build:
      context: ./engine
      dockerfile: Dockerfile
    container_name: antigravity_engine
    restart: unless-stopped
    ports:
      - "80:8080"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/engine.db
      - ENGINE_DATA_DIR=/app/data
      - GOMEMLIMIT=450MiB
      - GOGC=70
      - PORT=8080
      - PRE_LIVE_HOST=antigravity_prelive
      - PRE_LIVE_PORT=8082
    volumes:
      - ./data:/app/data
    mem_limit: 600m
    cpus: 1.50
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      # Image is FROM scratch — no wget/curl available. The binary does an
      # in-process self-check instead (see cmd/antigravity/main.go runHealthcheck).
      test: ["CMD", "/app/antigravity", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  pre_live:
    build:
      context: ./engine
      dockerfile: Dockerfile.prelive
    container_name: antigravity_prelive
    restart: unless-stopped
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      - PRE_LIVE_PORT=8082
      - PRE_LIVE_INITIAL_BALANCE_USD=100
      - FIXED_TRADE_SIZE_BTC=0.0001
      - MIN_EXECUTION_SIZE_BTC=0.0001
      - GOMEMLIMIT=300MiB
      - GOGC=80
    mem_limit: 400m
    cpus: 1.0
    pids_limit: 256
